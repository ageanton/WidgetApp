name: Build SoundPad Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Configs, Resources, Drawables & Layouts
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SoundPad"
          include(":app")
          EOF

          printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          rm -rf app/src/main/res
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # Light Theme Fixed Palette
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="widget_container_bg">#F1EFEA</color>
              <color name="widget_tile_bg">#E5E3DE</color>
              <color name="widget_tile_pressed">#DAD7D1</color>
              <color name="widget_content_tint">#2E2D2B</color>
              <color name="widget_ring_track">#D6D3CC</color>
              <color name="widget_ring_progress">#D97757</color>
          </resources>
          EOF

          # Dark Theme Fixed Palette (values-night)
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="widget_container_bg">#2B2A28</color>
              <color name="widget_tile_bg">#3A3936</color>
              <color name="widget_tile_pressed">#454340</color>
              <color name="widget_content_tint">#ECEAE5</color>
              <color name="widget_ring_track">#4A4844</color>
              <color name="widget_ring_progress">#D97757</color>
          </resources>
          EOF

          # App Launcher Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F1EFEA" android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:strokeColor="#D6D3CC"
                  android:strokeWidth="7"
                  android:pathData="M54,30 A24,24 0 1,1 53.9,30"/>
              <path
                  android:strokeColor="#D97757"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:pathData="M54,30 A24,24 0 1,1 33.2,66"/>
          </vector>
          EOF

          # Container Background: 28dp radius, flat color, no border/shadow/gradient
          cat << 'EOF' > app/src/main/res/drawable/bg_widget_container.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@color/widget_container_bg" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          # Tile Background: 20dp radius, flat color + ripple & pressed state shift
          cat << 'EOF' > app/src/main/res/drawable/bg_tile.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android"
              android:color="@color/widget_tile_pressed">
              <item>
                  <selector>
                      <item android:state_pressed="true">
                          <shape android:shape="rectangle">
                              <solid android:color="@color/widget_tile_pressed" />
                              <corners android:radius="20dp" />
                          </shape>
                      </item>
                      <item>
                          <shape android:shape="rectangle">
                              <solid android:color="@color/widget_tile_bg" />
                              <corners android:radius="20dp" />
                          </shape>
                      </item>
                  </selector>
              </item>
          </ripple>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): signal_cellular_alt
          cat << 'EOF' > app/src/main/res/drawable/ic_signal_cellular_alt.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M6.5,20C5.67,20 5,19.33 5,18.5v-3C5,14.67 5.67,14 6.5,14S8,14.67 8,15.5v3C8,19.33 7.33,20 6.5,20zM12,20c-0.83,0 -1.5,-0.67 -1.5,-1.5v-8c0,-0.83 0.67,-1.5 1.5,-1.5s1.5,0.67 1.5,1.5v8C13.5,19.33 12.83,20 12,20zM17.5,20c-0.83,0 -1.5,-0.67 -1.5,-1.5v-13C16,4.67 16.67,4 17.5,4S19,4.67 19,5.5v13C19,19.33 18.33,20 17.5,20z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): shield
          cat << 'EOF' > app/src/main/res/drawable/ic_shield.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M12,2.18c0.31,0 0.62,0.06 0.91,0.19l6,2.67C19.57,5.33 20,5.99 20,6.71v4.72c0,5.05 -3.41,9.76 -8,10.91c-4.59,-1.15 -8,-5.86 -8,-10.91V6.71c0,-0.72 0.43,-1.38 1.09,-1.67l6,-2.67C11.38,2.24 11.69,2.18 12,2.18z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): volume_off (0%)
          cat << 'EOF' > app/src/main/res/drawable/ic_volume_off.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M3.63,3.63c-0.39,0.39 -0.39,1.02 0,1.41L7.29,8.7L7,9H4c-0.55,0 -1,0.45 -1,1v4c0,0.55 0.45,1 1,1h3l3.29,3.29c0.63,0.63 1.71,0.18 1.71,-0.71v-4.17l4.18,4.18c-0.49,0.37 -1.02,0.68 -1.6,0.91c-0.36,0.15 -0.58,0.53 -0.58,0.92c0,0.72 0.73,1.18 1.39,0.91c0.8,-0.33 1.55,-0.77 2.22,-1.31l1.34,1.34c0.39,0.39 1.02,0.39 1.41,0c0.39,-0.39 0.39,-1.02 0,-1.41L5.05,3.63C4.66,3.24 4.02,3.24 3.63,3.63zM19,12c0,0.82 -0.15,1.61 -0.41,2.34l1.53,1.53c0.56,-1.17 0.88,-2.48 0.88,-3.87c0,-3.83 -2.4,-7.11 -5.78,-8.4C14.63,3.38 14,3.83 14,4.46v0.19c0,0.38 0.25,0.71 0.61,0.85C17.18,6.54 19,9.06 19,12zM10.29,5.71L7.88,8.12L12,12.24V6.41C12,5.52 10.92,5.07 10.29,5.71zM16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v1.79l2.48,2.48C16.49,12.16 16.5,12.08 16.5,12z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): volume_down (1-49%)
          cat << 'EOF' > app/src/main/res/drawable/ic_volume_down.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M5,10v4c0,0.55 0.45,1 1,1h3l3.29,3.29c0.63,0.63 1.71,0.18 1.71,-0.71V6.41c0,-0.89 -1.08,-1.34 -1.71,-0.71L9,9H6C5.45,9 5,9.45 5,10zM18.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05C17.48,15.29 18.5,13.77 18.5,12z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): volume_up (50%+)
          cat << 'EOF' > app/src/main/res/drawable/ic_volume_up.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M3,10v4c0,0.55 0.45,1 1,1h3l3.29,3.29c0.63,0.63 1.71,0.18 1.71,-0.71V6.41c0,-0.89 -1.08,-1.34 -1.71,-0.71L7,9H4C3.45,9 3,9.45 3,10zM16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05C15.48,15.29 16.5,13.77 16.5,12zM14,4.45v0.2c0,0.38 0.25,0.71 0.6,0.85C17.18,6.53 19,9.06 19,12s-1.82,5.47 -4.4,6.5c-0.36,0.14 -0.6,0.47 -0.6,0.85v0.2c0,0.63 0.63,1.07 1.21,0.85C18.6,19.11 21,15.84 21,12s-2.4,-7.11 -5.79,-8.4C14.63,3.38 14,3.82 14,4.45z" />
          </vector>
          EOF

          # 1x1 Small Widget Layout
          cat << 'EOF' > app/src/main/res/layout/widget_small.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_widget_container"
              android:padding="8dp">

              <FrameLayout
                  android:id="@+id/tile_small_root"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@drawable/bg_tile"
                  android:contentDescription="Control tile">

                  <FrameLayout
                      android:id="@+id/group_small_volume"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent">

                      <ImageView
                          android:id="@+id/img_small_ring"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:scaleType="fitCenter"
                          android:ImportantForAccessibility="no" />

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:gravity="center"
                          android:orientation="vertical"
                          android:padding="6dp">

                          <ImageView
                              android:id="@+id/img_small_vol_icon"
                              android:layout_width="18dp"
                              android:layout_height="18dp"
                              android:src="@drawable/ic_volume_down"
                              android:tint="@color/widget_content_tint"
                              android:importantForAccessibility="no" />

                          <TextView
                              android:id="@+id/txt_small_vol_pct"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:fontFamily="sans-serif-medium"
                              android:includeFontPadding="false"
                              android:text="30%"
                              android:textColor="@color/widget_content_tint"
                              android:textSize="12sp" />
                      </LinearLayout>
                  </FrameLayout>

                  <ImageView
                      android:id="@+id/img_small_center_icon"
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:layout_gravity="center"
                      android:tint="@color/widget_content_tint"
                      android:visibility="gone"
                      android:importantForAccessibility="no" />
              </FrameLayout>
          </FrameLayout>
          EOF

          # 3x1 Wide Widget Layout (Volume, Mobile Data, Battery Protection)
          cat << 'EOF' > app/src/main/res/layout/widget_wide.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_widget_container"
              android:orientation="horizontal"
              android:padding="8dp"
              android:baselineAligned="false">

              <!-- Tile 1: Volume -->
              <FrameLayout
                  android:id="@+id/tile_wide_volume"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:background="@drawable/bg_tile"
                  android:contentDescription="Volume level">

                  <ImageView
                      android:id="@+id/img_wide_ring"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="fitCenter"
                      android:importantForAccessibility="no" />

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:gravity="center"
                      android:orientation="vertical"
                      android:padding="6dp">

                      <ImageView
                          android:id="@+id/img_wide_vol_icon"
                          android:layout_width="18dp"
                          android:layout_height="18dp"
                          android:src="@drawable/ic_volume_down"
                          android:tint="@color/widget_content_tint"
                          android:importantForAccessibility="no" />

                      <TextView
                          android:id="@+id/txt_wide_vol_pct"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:fontFamily="sans-serif-medium"
                          android:includeFontPadding="false"
                          android:text="30%"
                          android:textColor="@color/widget_content_tint"
                          android:textSize="12sp" />
                  </LinearLayout>
              </FrameLayout>

              <!-- Tile 2: Mobile Data -->
              <FrameLayout
                  android:id="@+id/tile_wide_data"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:layout_marginStart="6dp"
                  android:layout_marginEnd="6dp"
                  android:background="@drawable/bg_tile"
                  android:padding="6dp"
                  android:contentDescription="Mobile data">

                  <ImageView
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_signal_cellular_alt"
                      android:tint="@color/widget_content_tint"
                      android:importantForAccessibility="no" />
              </FrameLayout>

              <!-- Tile 3: Battery Protection -->
              <FrameLayout
                  android:id="@+id/tile_wide_battery"
                  android:layout_width="0dp"
                  android:layout_height="match_parent"
                  android:layout_weight="1"
                  android:background="@drawable/bg_tile"
                  android:padding="6dp"
                  android:contentDescription="Battery protection">

                  <ImageView
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_shield"
                      android:tint="@color/widget_content_tint"
                      android:importantForAccessibility="no" />
              </FrameLayout>
          </LinearLayout>
          EOF

          # Provider XML 1: Small 1x1 Widget
          cat << 'EOF' > app/src/main/res/xml/widget_small_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="40dp"
              android:minHeight="40dp"
              android:minResizeHeight="40dp"
              android:maxResizeHeight="40dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_small"
              android:resizeMode="none"
              android:widgetCategory="home_screen" />
          EOF

          # Provider XML 2: Wide 3x1 Widget
          cat << 'EOF' > app/src/main/res/xml/widget_wide_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="40dp"
              android:minResizeHeight="40dp"
              android:maxResizeHeight="40dp"
              android:targetCellWidth="3"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_wide"
              android:resizeMode="horizontal"
              android:widgetCategory="home_screen" />
          EOF

      - name: Ensure Valid Persistent Release Keystore
        run: |
          mkdir -p app
          if ! keytool -list -keystore app/keystore.jks -storepass monolithPass2026 -alias monolith_key >/dev/null 2>&1; then
            rm -f app/keystore.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore app/keystore.jks \
              -alias monolith_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monolithPass2026 \
              -keypass monolithPass2026 \
              -dname "CN=SoundPad, OU=Mobile, O=SoundPadLocal, L=Local, S=Local, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist valid PKCS12 release keystore [skip ci]" || true
            git push || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SoundPad-Release.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundPad-Android-Release
          path: SoundPad-Release.apk
