name: Build SoundPad Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Configs, Themes, Drawables & Layouts
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SoundPad"
          include(":app")
          EOF

          printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\n" > gradle.properties

          rm -rf app/src/main/res
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          # System Auto Light Palette
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="widget_container_bg">#F1EFEA</color>
              <color name="widget_tile_bg">#E5E3DE</color>
              <color name="widget_tile_pressed">#DAD7D1</color>
              <color name="widget_content_tint">#2E2D2B</color>
          </resources>
          EOF

          # System Auto Dark Palette (values-night)
          cat << 'EOF' > app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="widget_container_bg">#2B2A28</color>
              <color name="widget_tile_bg">#3A3936</color>
              <color name="widget_tile_pressed">#454340</color>
              <color name="widget_content_tint">#ECEAE5</color>
          </resources>
          EOF

          # App Launcher Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F1EFEA" android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:strokeColor="#D6D3CC"
                  android:strokeWidth="7"
                  android:pathData="M54,30 A24,24 0 1,1 53.9,30"/>
              <path
                  android:strokeColor="#D97757"
                  android:strokeWidth="7"
                  android:strokeLineCap="round"
                  android:pathData="M54,30 A24,24 0 1,1 33.2,66"/>
          </vector>
          EOF

          # Helper function to generate standard (28dp/20dp) and compact (18dp/13dp) theme shapes
          create_theme_drawables() {
              local name=$1
              local c_bg=$2
              local t_bg=$3
              local t_press=$4

              cat << EOF > app/src/main/res/drawable/bg_container_${name}.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="${c_bg}" />
              <corners android:radius="28dp" />
          </shape>
          EOF

              cat << EOF > app/src/main/res/drawable/bg_tile_${name}.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="${t_press}">
              <item>
                  <selector>
                      <item android:state_pressed="true">
                          <shape android:shape="rectangle">
                              <solid android:color="${t_press}" />
                              <corners android:radius="20dp" />
                          </shape>
                      </item>
                      <item>
                          <shape android:shape="rectangle">
                              <solid android:color="${t_bg}" />
                              <corners android:radius="20dp" />
                          </shape>
                      </item>
                  </selector>
              </item>
          </ripple>
          EOF

              cat << EOF > app/src/main/res/drawable/bg_container_compact_${name}.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="${c_bg}" />
              <corners android:radius="18dp" />
          </shape>
          EOF

              cat << EOF > app/src/main/res/drawable/bg_tile_compact_${name}.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="${t_press}">
              <item>
                  <selector>
                      <item android:state_pressed="true">
                          <shape android:shape="rectangle">
                              <solid android:color="${t_press}" />
                              <corners android:radius="13dp" />
                          </shape>
                      </item>
                      <item>
                          <shape android:shape="rectangle">
                              <solid android:color="${t_bg}" />
                              <corners android:radius="13dp" />
                          </shape>
                      </item>
                  </selector>
              </item>
          </ripple>
          EOF
          }

          # Theme 0: System Auto (Day/Night)
          create_theme_drawables "auto" "@color/widget_container_bg" "@color/widget_tile_bg" "@color/widget_tile_pressed"
          # Theme 1: Warm Stone (Light)
          create_theme_drawables "warm" "#F1EFEA" "#E5E3DE" "#DAD7D1"
          # Theme 2: Obsidian (Warm Dark)
          create_theme_drawables "obsidian" "#2B2A28" "#3A3936" "#454340"
          # Theme 3: AMOLED Pitch (Pure Deep Black)
          create_theme_drawables "amoled" "#0D0E11" "#181A20" "#252830"
          # Theme 4: Nordic Slate (Cool Steel)
          create_theme_drawables "slate" "#222730" "#2E3440" "#3B4252"
          # Theme 5: Sage Moss (Matte Olive Stone)
          create_theme_drawables "sage" "#E4E8E1" "#D5DBD0" "#C5CEC0"

          # Material Symbols Rounded (FILL 1, Weight 500): volume_up
          cat << 'EOF' > app/src/main/res/drawable/ic_volume_up.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M3,10v4c0,0.55 0.45,1 1,1h3l3.29,3.29c0.63,0.63 1.71,0.18 1.71,-0.71V6.41c0,-0.89 -1.08,-1.34 -1.71,-0.71L7,9H4C3.45,9 3,9.45 3,10zM16.5,12c0,-1.77 -1.02,-3.29 -2.5,-4.03v8.05C15.48,15.29 16.5,13.77 16.5,12zM14,4.45v0.2c0,0.38 0.25,0.71 0.6,0.85C17.18,6.53 19,9.06 19,12s-1.82,5.47 -4.4,6.5c-0.36,0.14 -0.6,0.47 -0.6,0.85v0.2c0,0.63 0.63,1.07 1.21,0.85C18.6,19.11 21,15.84 21,12s-2.4,-7.11 -5.79,-8.4C14.63,3.38 14,3.82 14,4.45z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): signal_cellular_alt
          cat << 'EOF' > app/src/main/res/drawable/ic_signal_cellular_alt.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M6.5,20C5.67,20 5,19.33 5,18.5v-3C5,14.67 5.67,14 6.5,14S8,14.67 8,15.5v3C8,19.33 7.33,20 6.5,20zM12,20c-0.83,0 -1.5,-0.67 -1.5,-1.5v-8c0,-0.83 0.67,-1.5 1.5,-1.5s1.5,0.67 1.5,1.5v8C13.5,19.33 12.83,20 12,20zM17.5,20c-0.83,0 -1.5,-0.67 -1.5,-1.5v-13C16,4.67 16.67,4 17.5,4S19,4.67 19,5.5v13C19,19.33 18.33,20 17.5,20z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): shield
          cat << 'EOF' > app/src/main/res/drawable/ic_shield.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M12,2.18c0.31,0 0.62,0.06 0.91,0.19l6,2.67C19.57,5.33 20,5.99 20,6.71v4.72c0,5.05 -3.41,9.76 -8,10.91c-4.59,-1.15 -8,-5.86 -8,-10.91V6.71c0,-0.72 0.43,-1.38 1.09,-1.67l6,-2.67C11.38,2.24 11.69,2.18 12,2.18z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): language (globe)
          cat << 'EOF' > app/src/main/res/drawable/ic_language.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM18.92,8h-2.95c-0.32,-1.25 -0.78,-2.45 -1.38,-3.56 1.84,0.63 3.37,1.91 4.33,3.56zM12,4.04c0.83,1.2 1.48,2.53 1.91,3.96h-3.82c0.43,-1.43 1.08,-2.76 1.91,-3.96zM4.26,14C4.1,13.36 4,12.69 4,12s0.1,-1.36 0.26,-2h3.38c-0.08,0.66 -0.14,1.32 -0.14,2 0,0.68 0.06,1.34 0.14,2L4.26,14zM5.08,16h2.95c0.32,1.25 0.78,2.45 1.38,3.56 -1.84,-0.63 -3.37,-1.9 -4.33,-3.56zM8.03,8L5.08,8c0.96,-1.66 2.49,-2.93 4.33,-3.56C8.81,5.55 8.35,6.75 8.03,8zM12,19.96c-0.83,-1.2 -1.48,-2.53 -1.91,-3.96h3.82c-0.43,1.43 -1.08,2.76 -1.91,3.96zM14.34,14L9.66,14c-0.09,-0.66 -0.16,-1.32 -0.16,-2 0,-0.68 0.07,-1.35 0.16,-2h4.68c0.09,0.65 0.16,1.32 0.16,2 0,0.68 -0.07,1.34 -0.16,2zM14.59,19.56c0.6,-1.11 1.06,-2.31 1.38,-3.56h2.95c-0.96,1.65 -2.49,2.93 -4.33,3.56zM16.36,14c0.08,-0.66 0.14,-1.32 0.14,-2 0,-0.68 -0.06,-1.34 -0.14,-2h3.38c0.16,0.64 0.26,1.31 0.26,2s-0.1,1.36 -0.26,2h-3.38z" />
          </vector>
          EOF

          # Material Symbols Rounded (FILL 1, Weight 500): brightness_6 / display
          cat << 'EOF' > app/src/main/res/drawable/ic_display.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="@color/widget_content_tint"
                  android:pathData="M20,8.69V6c0,-1.1 -0.9,-2 -2,-2h-2.69l-1.9,-1.9c-0.78,-0.78 -2.05,-0.78 -2.83,0L8.69,4H6c-1.1,0 -2,0.9 -2,2v2.69l-1.9,1.9c-0.78,0.78 -0.78,2.05 0,2.83l1.9,1.9V18c0,1.1 0.9,2 2,2h2.69l1.9,1.9c0.78,0.78 2.05,0.78 2.83,0l1.9,-1.9H18c1.1,0 2,-0.9 2,-2v-2.69l1.9,-1.9c0.78,-0.78 0.78,-2.05 0,-2.83L20,8.69zM12,17c-2.76,0 -5,-2.24 -5,-5s2.24,-5 5,-5v10z" />
          </vector>
          EOF

          # 1x1 Layout Variant A: Compact (52dp floating hardware chip - DEFAULT)
          cat << 'EOF' > app/src/main/res/layout/widget_small_compact.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <FrameLayout
                  android:id="@+id/small_container_bg"
                  android:layout_width="52dp"
                  android:layout_height="52dp"
                  android:layout_gravity="center"
                  android:background="@drawable/bg_container_compact_auto"
                  android:padding="5dp">

                  <FrameLayout
                      android:id="@+id/tile_small_root"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="@drawable/bg_tile_compact_auto"
                      android:contentDescription="Control tile">

                      <ImageView
                          android:id="@+id/img_small_center_icon"
                          android:layout_width="21dp"
                          android:layout_height="21dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_volume_up"
                          android:importantForAccessibility="no" />

                      <ImageView
                          android:id="@+id/img_small_vol_led"
                          android:layout_width="8dp"
                          android:layout_height="8dp"
                          android:layout_gravity="top|end"
                          android:layout_marginTop="4dp"
                          android:layout_marginEnd="4dp"
                          android:visibility="gone"
                          android:importantForAccessibility="no" />
                  </FrameLayout>
              </FrameLayout>
          </FrameLayout>
          EOF

          # 1x1 Layout Variant B: Micro (44dp ultra-compact chip)
          cat << 'EOF' > app/src/main/res/layout/widget_small_micro.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <FrameLayout
                  android:id="@+id/small_container_bg"
                  android:layout_width="44dp"
                  android:layout_height="44dp"
                  android:layout_gravity="center"
                  android:background="@drawable/bg_container_compact_auto"
                  android:padding="4dp">

                  <FrameLayout
                      android:id="@+id/tile_small_root"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="@drawable/bg_tile_compact_auto"
                      android:contentDescription="Control tile">

                      <ImageView
                          android:id="@+id/img_small_center_icon"
                          android:layout_width="18dp"
                          android:layout_height="18dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_volume_up"
                          android:importantForAccessibility="no" />

                      <ImageView
                          android:id="@+id/img_small_vol_led"
                          android:layout_width="7dp"
                          android:layout_height="7dp"
                          android:layout_gravity="top|end"
                          android:layout_marginTop="3dp"
                          android:layout_marginEnd="3dp"
                          android:visibility="gone"
                          android:importantForAccessibility="no" />
                  </FrameLayout>
              </FrameLayout>
          </FrameLayout>
          EOF

          # 1x1 Layout Variant C: Standard Full Cell
          cat << 'EOF' > app/src/main/res/layout/widget_small_full.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/small_container_bg"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_container_auto"
              android:padding="8dp">

              <FrameLayout
                  android:id="@+id/tile_small_root"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@drawable/bg_tile_auto"
                  android:padding="6dp"
                  android:contentDescription="Control tile">

                  <ImageView
                      android:id="@+id/img_small_center_icon"
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_volume_up"
                      android:importantForAccessibility="no" />

                  <ImageView
                      android:id="@+id/img_small_vol_led"
                      android:layout_width="10dp"
                      android:layout_height="10dp"
                      android:layout_gravity="top|end"
                      android:layout_marginTop="2dp"
                      android:layout_marginEnd="2dp"
                      android:visibility="gone"
                      android:importantForAccessibility="no" />
              </FrameLayout>
          </FrameLayout>
          EOF

          # 2x3 Grid Widget Layout (5 Tiles + Volume LED Indicator)
          cat << 'EOF' > app/src/main/res/layout/widget_grid_2x3.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/grid_container_bg"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/bg_container_auto"
              android:orientation="vertical"
              android:padding="8dp"
              android:baselineAligned="false">

              <!-- Row 1: Volume (left), Mobile Data (right) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginBottom="6dp"
                  android:orientation="horizontal"
                  android:baselineAligned="false">

                  <FrameLayout
                      android:id="@+id/tile_grid_volume"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:background="@drawable/bg_tile_auto"
                      android:padding="6dp"
                      android:contentDescription="Toggle preset volume">

                      <ImageView
                          android:id="@+id/img_grid_volume"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_volume_up"
                          android:importantForAccessibility="no" />

                      <ImageView
                          android:id="@+id/img_grid_vol_led"
                          android:layout_width="10dp"
                          android:layout_height="10dp"
                          android:layout_gravity="top|end"
                          android:layout_marginTop="2dp"
                          android:layout_marginEnd="2dp"
                          android:importantForAccessibility="no" />
                  </FrameLayout>

                  <FrameLayout
                      android:id="@+id/tile_grid_data"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginStart="3dp"
                      android:background="@drawable/bg_tile_auto"
                      android:padding="6dp"
                      android:contentDescription="Mobile data">

                      <ImageView
                          android:id="@+id/img_grid_data"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_signal_cellular_alt"
                          android:importantForAccessibility="no" />
                  </FrameLayout>
              </LinearLayout>

              <!-- Row 2: Battery Protection (left), Internet (right) -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginBottom="6dp"
                  android:orientation="horizontal"
                  android:baselineAligned="false">

                  <FrameLayout
                      android:id="@+id/tile_grid_battery"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:background="@drawable/bg_tile_auto"
                      android:padding="6dp"
                      android:contentDescription="Battery protection">

                      <ImageView
                          android:id="@+id/img_grid_battery"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_shield"
                          android:importantForAccessibility="no" />
                  </FrameLayout>

                  <FrameLayout
                      android:id="@+id/tile_grid_internet"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:layout_marginStart="3dp"
                      android:background="@drawable/bg_tile_auto"
                      android:padding="6dp"
                      android:contentDescription="Internet">

                      <ImageView
                          android:id="@+id/img_grid_internet"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_gravity="center"
                          android:src="@drawable/ic_language"
                          android:importantForAccessibility="no" />
                  </FrameLayout>
              </LinearLayout>

              <!-- Row 3: Display Settings (full-width bottom bar) -->
              <FrameLayout
                  android:id="@+id/tile_grid_display"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="@drawable/bg_tile_auto"
                  android:padding="6dp"
                  android:contentDescription="Display settings">

                  <ImageView
                      android:id="@+id/img_grid_display"
                      android:layout_width="26dp"
                      android:layout_height="26dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_display"
                      android:importantForAccessibility="no" />
              </FrameLayout>
          </LinearLayout>
          EOF

          # Provider XML 1: Small 1x1 Widget
          cat << 'EOF' > app/src/main/res/xml/widget_small_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="40dp"
              android:minHeight="40dp"
              android:minResizeHeight="40dp"
              android:maxResizeHeight="40dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_small_compact"
              android:resizeMode="none"
              android:widgetCategory="home_screen" />
          EOF

          # Provider XML 2: 2x3 Grid Widget
          cat << 'EOF' > app/src/main/res/xml/widget_grid_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="180dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="180dp"
              android:targetCellWidth="2"
              android:targetCellHeight="3"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_grid_2x3"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

      - name: Ensure Valid Persistent Release Keystore
        run: |
          mkdir -p app
          if ! keytool -list -keystore app/keystore.jks -storepass monolithPass2026 -alias monolith_key >/dev/null 2>&1; then
            rm -f app/keystore.jks
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore app/keystore.jks \
              -alias monolith_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass monolithPass2026 \
              -keypass monolithPass2026 \
              -dname "CN=SoundPad, OU=Mobile, O=SoundPadLocal, L=Local, S=Local, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "chore: persist valid PKCS12 release keystore [skip ci]" || true
            git push || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SoundPad-Release.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundPad-Android-Release
          path: SoundPad-Release.apk
